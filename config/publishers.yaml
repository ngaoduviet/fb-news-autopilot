version: 1
publishers:
  - canonical_name: VnExpress
    host_aliases: [vnexpress.net, www.vnexpress.net]
    feed_urls: [https://vnexpress.net/rss/tin-moi-nhat.rss]
    origin_quality: DIRECT_REPUTABLE_ARTICLE
    timezone: Asia/Ho_Chi_Minh
    category_paths: [/thoi-su, /kinh-doanh, /the-gioi, /doi-song, /suc-khoe, /so-hoa, /the-thao, /giai-tri]
    category_path_patterns: ['^/[^/]+/?$']
    article_path_patterns: ['-[0-9]+\.html$']
    article_body_selectors: ['article.fck_detail', '.fck_detail']
    title_selectors: ['h1.title-detail']
    publication_time_selectors: ['meta[itemprop="datePublished"]@content']
    update_time_selectors: ['meta[itemprop="dateModified"]@content']
  - canonical_name: Dân trí
    host_aliases: [dantri.com.vn, www.dantri.com.vn]
    feed_urls: [https://dantri.com.vn/rss/home.rss]
    origin_quality: DIRECT_REPUTABLE_ARTICLE
    timezone: Asia/Ho_Chi_Minh
    category_paths: [/xa-hoi, /kinh-doanh, /the-gioi, /doi-song, /suc-khoe, /cong-nghe, /the-thao, /giai-tri]
    category_path_patterns: ['^/[^/]+/?$']
    article_path_patterns: ['-[0-9]{8,}\.htm$']
    article_body_selectors: ['article.singular-container', '.singular-content']
    title_selectors: ['h1.title-page', 'h1']
    publication_time_selectors: ['meta[property="article:published_time"]@content']
    update_time_selectors: ['meta[property="article:modified_time"]@content']
  - canonical_name: Tuổi Trẻ
    host_aliases: [tuoitre.vn, www.tuoitre.vn]
    feed_urls: [https://tuoitre.vn/rss/tin-moi-nhat.rss]
    origin_quality: DIRECT_REPUTABLE_ARTICLE
    timezone: Asia/Ho_Chi_Minh
    category_paths: [/thoi-su, /kinh-doanh, /the-gioi, /nhip-song-tre, /suc-khoe, /cong-nghe, /the-thao, /giai-tri]
    category_path_patterns: ['^/[^/]+/?$']
    article_path_patterns: ['-[0-9]{10,}\.htm$']
    article_body_selectors: ['.detail-content', 'article']
    title_selectors: ['h1.detail-title', 'h1']
    publication_time_selectors: ['meta[property="article:published_time"]@content']
    update_time_selectors: ['meta[property="article:modified_time"]@content']
  - canonical_name: Thanh Niên
    host_aliases: [thanhnien.vn, www.thanhnien.vn]
    feed_urls: [https://thanhnien.vn/rss/home.rss]
    origin_quality: DIRECT_REPUTABLE_ARTICLE
    timezone: Asia/Ho_Chi_Minh
    category_paths: [/thoi-su, /tai-chinh-kinh-doanh, /the-gioi, /doi-song, /suc-khoe, /cong-nghe, /the-thao, /giai-tri]
    category_path_patterns: ['^/[^/]+/?$']
    article_path_patterns: ['-[0-9]+\.htm$']
    article_body_selectors: ['.detail-content', '.cms-body', 'article']
    title_selectors: ['h1.detail-title', 'h1']
    publication_time_selectors: ['meta[property="article:published_time"]@content']
    update_time_selectors: ['meta[property="article:modified_time"]@content']
